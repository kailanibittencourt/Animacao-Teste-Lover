<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Teaster</title>
</head>
<body>
  <!-- Conteúdo principal da página -->
  <main class="container">
    <!-- Título principal -->
    <h1>♡ Love Tester ♡</h1>
    <!-- Parágrafo de apresentação -->
    <p>Será que vocês combinam?</p>
    <!-- Área dos nomes -->
    <div class="nomes">
      <p>Kailani 💗 Guilherme</p>
    </div>

    <!-- Imagem do gatinho -->
    <img
      class="gatinho"
      src="./img/gatinho.gif"
      alt="Gatinho fofo"
    >

    <!-- Mensagem exibida durante a animação -->
    <p class="calculando">Calculando o amor...</p>

    <!-- Área externa da barra de carregamento -->
    <div class="barra">

      <!-- Parte que cresce durante a animação -->
      <div class="progresso"></div>

    </div>

    <!-- Resultado que aparece ao final -->
    <div class="resultado">
      <h2> 100% 🔥</h2>
      <p>Feitos um para o outro 💗</p>
    </div>

  </main>
</body>
</html>
